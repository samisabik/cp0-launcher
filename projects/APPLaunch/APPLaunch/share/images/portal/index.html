    ctx.clearRect(0, 0, s, s);

    // 1) iridescent foil: pastel rainbow bands that fade to transparent,
    //    angle + phase follow the viewing angle (pointer)
    const angle = Math.PI / 4 + (p.x - 0.5) * 1.2 - (p.y - 0.5) * 0.6;
    const phase = (p.x + p.y) * 360 + t * 12;
    const L = s * 1.5;
    const dx = Math.cos(angle) * L / 2, dy = Math.sin(angle) * L / 2;
    const g = ctx.createLinearGradient(s / 2 - dx, s / 2 - dy, s / 2 + dx, s / 2 + dy);
    const N = 48;
    for (let i = 0; i <= N; i++) {
      const k = i / N;
      const hue = (k * 720 + phase) % 360;
      // alpha wave => the "transparent" part of the hologram
      const a = 0.38 + 0.62 * (0.5 + 0.5 * Math.sin(k * Math.PI * 10 + phase * 0.035));
      // saturation wave => stretches of pure white between the colours
      const sat = 100 * (0.5 + 0.5 * Math.sin(k * Math.PI * 6 - phase * 0.02));
      g.addColorStop(k, `hsla(${hue}, ${sat}%, 84%, ${a})`);
    }
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);

    // 2) white specular glare under the pointer
    const gx = p.x * s, gy = p.y * s;
    const r = ctx.createRadialGradient(gx, gy, 0, gx, gy, s * 0.45);
    r.addColorStop(0, 'rgba(255,255,255,0.95)');
    r.addColorStop(0.4, 'rgba(255,255,255,0.35)');
    r.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = r;
    ctx.fillRect(0, 0, s, s);

    // 3) thin sweeping light bar
    const sweep = ((t * 0.18) % 1.6 - 0.3) * s;
    const b = ctx.createLinearGradient(sweep - s * 0.08, 0, sweep + s * 0.08, s * 0.16);
    b.addColorStop(0, 'rgba(255,255,255,0)');
    b.addColorStop(0.5, 'rgba(255,255,255,0.7)');
    b.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = b;
    ctx.fillRect(0, 0, s, s);

    // 4) keep only the line art
    ctx.globalCompositeOperation = 'destination-in';
    ctx.drawImage(mask, 0, 0);

    // physical tilt, like turning a sticker in the light
    canvas.style.transform =
      `rotateY(${(p.x - 0.5) * 14}deg) rotateX(${(0.5 - p.y) * 14}deg)`;

    requestAnimationFrame(frame);
  }

  addEventListener('pointermove', e => {
    const b = canvas.getBoundingClientRect();
    p.tx = Math.min(1, Math.max(0, (e.clientX - b.left) / b.width));
    p.ty = Math.min(1, Math.max(0, (e.clientY - b.top) / b.height));
    p.active = 1;
  });
  addEventListener('pointerleave', () => p.active = 0);
  document.addEventListener('mouseleave', () => p.active = 0);
  addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') p.active = 0; });
  addEventListener('deviceorientation', e => {
    if (e.gamma == null) return;
    p.tx = Math.min(1, Math.max(0, 0.5 + e.gamma / 60));
    p.ty = Math.min(1, Math.max(0, 0.5 + (e.beta - 45) / 60));
    p.active = 1;
  });
  addEventListener('resize', resize);

  img.onload = () => { resize(); requestAnimationFrame(frame); };
  img.src = SRC;
})();
</script>
</body>
</html>
